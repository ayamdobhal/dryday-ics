name: Update dry day feed

on:
  schedule:
    - cron: "30 4 * * *" # 10:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Mumbai calendar from isitadryday.in
        run: python scrape.py maharashtra

      - name: Commit feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet -- data; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "chore: update dry day feed $(date -u +%F)"
          git push
